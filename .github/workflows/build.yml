name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        shell: bash
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Dump API info
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          : > /tmp/info.txt
          M=$(find ~/.gradle -name "minecraft-merged-*yarn*.jar" | head -1)
          for C in net.minecraft.client.gui.PlayerSkinDrawer net.minecraft.entity.player.SkinTextures net.minecraft.client.texture.PlayerSkinProvider net.minecraft.client.session.Session net.minecraft.client.gui.screen.world.SelectWorldScreen net.minecraft.client.gui.screen.option.OptionsScreen net.minecraft.client.gui.screen.multiplayer.MultiplayerScreen net.minecraft.client.gui.screen.TitleScreen net.minecraft.client.util.DefaultSkinHelper net.minecraft.client.gl.RenderPipelines; do
            echo "=== $C" >> /tmp/info.txt
            javap -p -cp "$M" "$C" 2>&1 | grep -v "field_\|lambda\|method_[0-9]" | grep "public\|class\|Error" | cut -c1-260 >> /tmp/info.txt
          done
          echo "=== MC" >> /tmp/info.txt
          javap -p -cp "$M" net.minecraft.client.MinecraftClient 2>&1 | grep -i "session\|skin\|GameProfile\|getRunDirectory" | cut -c1-200 >> /tmp/info.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan info-log; git rm -rf --quiet . || true
          cp /tmp/info.txt info.txt; git add info.txt; git commit -q -m info; git push -f origin info-log
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin build-log
      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/*.jar \
            --title "KillVisual build ${{ github.run_number }}" \
            --notes "Fabric 1.21.11. Put the .jar into your mods folder (with Fabric API)."
