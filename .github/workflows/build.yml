name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        shell: bash
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Dump API
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          find / -name "*.jar" -path "*loom*" 2>/dev/null | grep -i -v "sources" | head -40 > /tmp/jars.txt
          J=$(grep -i "minecraft" /tmp/jars.txt | grep -i "merged\|named\|mapped" | head -1)
          cat /tmp/jars.txt > /tmp/api.txt; echo "JAR=$J" >> /tmp/api.txt
          for c in net.minecraft.client.gl.Framebuffer net.minecraft.client.gl.SimpleFramebuffer net.minecraft.client.render.GameRenderer com.mojang.blaze3d.systems.CommandEncoder com.mojang.blaze3d.textures.GpuTexture com.mojang.blaze3d.systems.RenderPass com.mojang.blaze3d.systems.RenderSystem net.minecraft.client.render.RenderTickCounter; do
            echo "== $c" >> /tmp/api.txt
            javap -cp "$J" -public $c 2>&1 | head -120 >> /tmp/api.txt
          done
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan info-log; git rm -rf --quiet . ; cp /tmp/api.txt api.txt
          git add api.txt; git commit -q -m api; git push -f origin info-log
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin build-log
      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/*.jar \
            --title "KillVisual build ${{ github.run_number }}" \
            --notes "Fabric 1.21.11. Put the .jar into your mods folder (with Fabric API)."
