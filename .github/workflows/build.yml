name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        shell: bash
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Dump API
        shell: bash
        run: |
          set +e +o pipefail
          find ~/.gradle /home/runner/work -name "*.jar" -path "*loom*" 2>/dev/null | grep -i "mapped\|yarn\|named" > /tmp/list.txt; J=$(grep "minecraft-merged-1.21" /tmp/list.txt | grep -v intermediary | head -1); cat /tmp/list.txt > /tmp/api0.txt
          cp /tmp/api0.txt /tmp/api.txt; echo "J=$J" >> /tmp/api.txt
          javap -p -c -cp "$J" net.minecraft.client.gui.screen.ingame.HandledScreen | awk '/^  public void render\(|^  public void renderMain|^  public void renderBackground|^  protected void drawSlots/{p=1} /^$/{p=0} p' | grep -v "aload\|iload\|fload\|dload\|astore\|istore\|dup\|pop\|getfield\|ldc\|const\|bipush\|ifeq\|goto" >> /tmp/api.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan info-log; git rm -rf --quiet . ; cp /tmp/api.txt api.txt; git add api.txt; git commit -q -m info; git push -f origin info-log
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin build-log
      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/*.jar \
            --title "KillVisual build ${{ github.run_number }}" \
            --notes "Fabric 1.21.11. Put the .jar into your mods folder (with Fabric API)."
