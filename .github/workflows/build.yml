name: Build mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        shell: bash
        run: gradle build --no-daemon 2>&1 | tee build.log
      - name: Dump API
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          J=$(find ~/.gradle/caches/fabric-loom/minecraftMaven -name "minecraft-merged-1.21.11-net.fabricmc.yarn*.jar" | head -1)
          echo "JAR=$J" > /tmp/api.txt
          C=$(find ~/.gradle/caches/fabric-loom/1.21.11 -name minecraft-client.jar | head -1)
          unzip -l "$C" | grep -i "post_effect\|shaders/post" | awk '{print $4}' >> /tmp/api.txt
          for c in 'net.minecraft.client.gl.PostEffectPipeline$Input' 'net.minecraft.client.gl.PostEffectPipeline$TextureSampler' 'net.minecraft.client.gl.PostEffectPipeline$TargetSampler' 'net.minecraft.client.gl.PostEffectPipeline$Pass' 'net.minecraft.client.gl.PostEffectPipeline$Targets' 'net.minecraft.client.gl.PostEffectProcessor$FramebufferSet' net.minecraft.client.texture.NativeImageBackedTexture net.minecraft.client.texture.AbstractTexture net.minecraft.client.util.memory.ObjectAllocator net.minecraft.client.MinecraftClient; do
            echo "== $c" >> /tmp/api.txt
            javap -cp "$J" -public -s "$c" 2>&1 | grep -v "^  *descriptor" | head -70 >> /tmp/api.txt
          done
          javap -cp "$J" -public net.minecraft.client.gl.PostEffectProcessor | grep parseEffect >> /tmp/api.txt
          javap -cp "$J" -public net.minecraft.client.MinecraftClient | grep -i "getFramebuffer\|getTextureManager\|getShaderLoader\|getPostEffect" >> /tmp/api.txt
          echo "== blit.fsh" >> /tmp/api.txt; unzip -p "$C" assets/minecraft/shaders/post/blit.fsh >> /tmp/api.txt
          echo "== post/box_blur.fsh" >> /tmp/api.txt; unzip -p "$C" assets/minecraft/shaders/post/box_blur.fsh >> /tmp/api.txt
          echo "== screenquad" >> /tmp/api.txt; unzip -l "$C" | grep -i "screenquad\|blit" | awk '{print $4}' >> /tmp/api.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan info-log; git rm -rf --quiet . ; cp /tmp/api.txt api.txt
          git add api.txt; git commit -q -m api; git push -f origin info-log
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          cp build.log /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin build-log
      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/*.jar \
            --title "KillVisual build ${{ github.run_number }}" \
            --notes "Fabric 1.21.11. Put the .jar into your mods folder (with Fabric API)."
